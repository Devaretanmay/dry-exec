name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-wheels:
    name: Build Linux Wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"
      - name: Install Maturin
        run: pip install --no-cache-dir maturin
      - name: Build sdist and wheels
        run: maturin build --release --sdist -o dist
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4.4.3
        with:
          name: wheels
          path: dist/*

  publish-pypi:
    name: Publish to PyPI
    needs: [build-wheels]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4.1.8
        with:
          name: wheels
          path: dist
      - name: Publish Package to PyPI
        uses: pypa/gh-action-pypi-publish@v1.12.3
        with:
          skip-existing: true
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}

  publish-cargo:
    name: Publish Crates to Crates.io
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Publish dry-exec-core
        run: cargo publish -p dry-exec-core --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish dry-exec-pyo3
        run: cargo publish -p dry-exec-pyo3 --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
