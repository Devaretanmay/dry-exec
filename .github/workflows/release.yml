name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-wheels:
    name: Build ${{ matrix.platform }} Wheels
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: manylinux
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: macos
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}
      - name: Install wheel builder
        run: pip install --no-cache-dir cibuildwheel
      - name: Build wheels
        run: |
          if [ "${{ matrix.platform }}" = "manylinux" ]; then
            CIBW_BUILD=cp311-* CIBW_ARCHS_LINUX=x86_64 cibuildwheel --output-dir dist
          else
            CIBW_BUILD=cp311-* CIBW_ARCHS_MACOS=universal2 cibuildwheel --output-dir dist
          fi
      - name: Install built wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "import dry_exec; print(dry_exec.__all__)"
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4.4.3
        with:
          name: wheels-${{ matrix.platform }}
          path: dist/*

  publish-gate:
    name: Evaluate Registry Credentials
    runs-on: ubuntu-latest
    outputs:
      pypi: ${{ steps.check.outputs.pypi }}
      cargo: ${{ steps.check.outputs.cargo }}
    steps:
      - name: Check which registry tokens are configured
        id: check
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "${PYPI_API_TOKEN}" ]; then
            echo "pypi=true" >> "$GITHUB_OUTPUT"
          else
            echo "pypi=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PYPI_API_TOKEN is not configured for this repository; skipping the PyPI publish."
          fi
          if [ -n "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "cargo=true" >> "$GITHUB_OUTPUT"
          else
            echo "cargo=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CARGO_REGISTRY_TOKEN is not configured for this repository; skipping the crates.io publish."
          fi

  publish-pypi:
    name: Publish to PyPI
    needs: [build-wheels, publish-gate]
    runs-on: ubuntu-latest
    if: needs.publish-gate.outputs.pypi == 'true'
    steps:
      - uses: actions/download-artifact@v4.1.8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish Package to PyPI
        uses: pypa/gh-action-pypi-publish@v1.12.3
        with:
          skip-existing: true
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}

  publish-cargo:
    name: Publish Crates to Crates.io
    needs: [publish-gate]
    runs-on: ubuntu-latest
    if: needs.publish-gate.outputs.cargo == 'true'
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Publish dry-exec-core
        run: cargo publish -p dry-exec-core --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish dry-exec-pyo3
        run: cargo publish -p dry-exec-pyo3 --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
