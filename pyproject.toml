[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "dry-exec"
version = "0.1.0"
description = "Deterministic ephemeral execution primitive and state delta engine"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "opentelemetry-api>=1.20.0",
    "httpx>=0.27.0",
    "openai>=1.30.0",
]


[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
de = "dry_exec.cli:main"
dex = "dry_exec.cli:main"
dry-exec = "dry_exec.cli:main"

[tool.pytest.ini_options]
pythonpath = ["python", "."]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"
# Documentation snippets are illustrative; keep the formatter off prose files.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Explicit rule surface. Ruff's implicit default set grows between releases, which
# silently changes this gate without any change to the codebase.
select = ["E4", "E7", "E9", "F"]

[tool.maturin]
manifest-path = "crates/dry-exec-pyo3/Cargo.toml"
python-source = "python"
module-name = "dry_exec._dry_exec_ffi"
