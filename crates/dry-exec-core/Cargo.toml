[package]
name = "dry-exec-core"
version = "0.1.0"
edition = "2021"
authors = ["dry-exec systems engineering"]
description = "Deterministic ephemeral execution primitive and state delta engine"

[features]
default = []
laya = ["dep:anyhow", "dep:laya-rs", "dep:serde_json"]

[dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["process", "sched", "signal", "mman", "fs", "user", "mount"] }
bitflags = "2.6"
thiserror = "2.0"
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
laya-rs = { version = "0.1", default-features = false, optional = true }
anyhow = { version = "1", optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3.10"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "delta_bench"
harness = false

[[bench]]
name = "decision_bench"
harness = false
